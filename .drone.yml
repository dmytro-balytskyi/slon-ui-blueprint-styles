# Публікація пакета перенесена в slonbeton/slon24-design-lib (Woodpecker, власний Verdaccio, ADR-003 крок 4).
# Цей репо більше нічого не публікує; пайплайн лишено тимчасово (test, notify, downstream) до завершення переїзду.
---
kind: pipeline
type: kubernetes
name: slon-ui-blueprint-styles

steps:
  - name: test
    image: node:22-alpine
    commands:
      - corepack enable
      - corepack prepare pnpm@10.20.0 --activate
      - pnpm config set registry https://npm.taxi-beton.ua
      - pnpm install --frozen-lockfile
      - pnpm format:check
      - pnpm test

  - name: notify
    image: registry.taxi-beton.ua/drone-telegram:latest
    pull: always
    settings:
      message_file: npm_message
      token:
        from_secret: telegram_token
      to:
        from_secret: telegram_to
    when:
      status: [ success, failure ]
  
  - name: trigger
    image: plugins/downstream
    settings:
      server:
        from_secret: drone_server
      token:
        from_secret: drone_token
      repositories:
        - dmytro-balytskyi/slon-ui-menu24
    when:
      status: [success]

trigger:
  branch:
    - master
  event:
    - push
