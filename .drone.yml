---
kind: pipeline
type: kubernetes
name: slon-ui-blueprint-styles

steps:
  - name: publish
    image: plugins/npm
    settings:
      username:
        from_secret: npm_username
      password:
        from_secret: npm_password
      email:
        from_secret: npm_email
      token:
        from_secret: npm_token

  # Доставка в хост: коміт bump lock у slon-ui-menu24 (замість plugins/downstream, який
  # лише перебілдовував хост із pnpm update --latest поза git). Деталі — scripts/bump-host.sh.
  # Пуш іде git-обліковими даними самого пайплайну (DRONE_NETRC_*, Drone віддає їх крокам
  # для приватних репо) — нового секрету не треба. Щоб звузити доступ до одного репо,
  # додати deploy key з правом запису на menu24 і секрет: DEPLOY_KEY: { from_secret: menu24_deploy_key }.
  - name: bump-host
    image: node:22-alpine
    environment:
      TARGET: dmytro-balytskyi/slon-ui-menu24
      REGISTRY: https://npm.taxi-beton.ua
    commands:
      - apk add --no-cache git openssh-client
      - corepack enable
      - corepack prepare pnpm@10.20.0 --activate
      - sh scripts/bump-host.sh
    when:
      status: [success]

  - name: notify
    image: registry.taxi-beton.ua/drone-telegram:latest
    pull: always
    settings:
      message_file: npm_message
      token:
        from_secret: telegram_token
      to:
        from_secret: telegram_to
    when:
      status: [ success, failure ]

trigger:
  branch:
    - master
  event:
    - push
---
