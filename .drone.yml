---
kind: pipeline
type: kubernetes
name: slon-ui-blueprint-styles

steps:
  - name: publish
    image: plugins/npm
    settings:
      username:
        from_secret: npm_username
      password:
        from_secret: npm_password
      email:
        from_secret: npm_email
      token:
        from_secret: npm_token

  # Доставка в хост: коміт bump lock у slon-ui-menu24 (замість plugins/downstream, який
  # лише перебілдовував хост із pnpm update --latest поза git). Деталі — scripts/bump-host.sh.
  - name: bump-host
    image: node:22-alpine
    environment:
      DEPLOY_KEY:
        from_secret: menu24_deploy_key
      TARGET_REPO: git@github.com:dmytro-balytskyi/slon-ui-menu24.git
      REGISTRY: https://npm.taxi-beton.ua
    commands:
      - apk add --no-cache git openssh-client
      - corepack enable
      - corepack prepare pnpm@10.20.0 --activate
      - sh scripts/bump-host.sh
    when:
      status: [success]

  - name: notify
    image: registry.taxi-beton.ua/drone-telegram:latest
    pull: always
    settings:
      message_file: npm_message
      token:
        from_secret: telegram_token
      to:
        from_secret: telegram_to
    when:
      status: [ success, failure ]

trigger:
  branch:
    - master
  event:
    - push
---
kind: signature
hmac: dba012f194b0559e4f5c12b4c6278798c01c12a85e76349fffeac28a38edf53e

