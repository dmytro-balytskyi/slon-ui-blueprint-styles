---
kind: pipeline
type: kubernetes
name: slon-ui-blueprint-styles

steps:
  - name: test
    image: node:22-alpine
    commands:
      - corepack enable
      - corepack prepare pnpm@10.20.0 --activate
      - pnpm config set registry https://npm.taxi-beton.ua
      - pnpm install --frozen-lockfile
      - pnpm test

  - name: publish
    image: plugins/npm
    settings:
      username:
        from_secret: npm_username
      password:
        from_secret: npm_password
      email:
        from_secret: npm_email
      token:
        from_secret: npm_token
    when:
      status: [success]

  - name: notify
    image: registry.taxi-beton.ua/drone-telegram:latest
    pull: always
    settings:
      message_file: npm_message
      token:
        from_secret: telegram_token
      to:
        from_secret: telegram_to
    when:
      status: [ success, failure ]
  
  - name: trigger
    image: plugins/downstream
    settings:
      server:
        from_secret: drone_server
      token:
        from_secret: drone_token
      repositories:
        - dmytro-balytskyi/slon-ui-menu24
    when:
      status: [success]

trigger:
  branch:
    - master
  event:
    - push
---
kind: signature
hmac: 0d4c20719c87f3ad9676d3cc4114c24be2584f9d9239466c6556bd0e468cc203

